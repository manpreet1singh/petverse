# Local Postgres + Redis. Start with: docker compose up -d
# Then set DATABASE_URL in backend/.env (see backend/.env.example).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: petverse
      POSTGRES_USER: petverse
      POSTGRES_PASSWORD: petverse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
